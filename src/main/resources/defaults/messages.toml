[admin]
# /economy reload.
reloaded = "{prefix}&aMessages and currency values reloaded. Settings marked (restart) still need a restart."
# /economy version.
version = "{prefix}&7Elements: Economy &f{version} &8| &7Currency: &f{currency} &8| &7Storage: &f{storage}"
# Storage convert started.
convert_started = "{prefix}&7Copying data to {type}..."
# Storage convert finished.
convert_done = "{prefix}&aData copied to {type}. Set backend = \"{type}\" in storage.toml and restart."
# Storage convert failed.
convert_failed = "{prefix}&cCopy to {type} failed: {error}"
# Already the active storage type.
convert_same = "{prefix}&c{type} is already in use."
# A convert is already running.
convert_running = "{prefix}&cA copy is already running."
# Unknown storage type.
convert_unknown = "{prefix}&c{type} is not a storage type. Use one of: {types}."

[migrate]
# /economy migrate, list title.
header = "{prefix}&7Balances found from other economy mods:"
# One source.
line = "&8 - &f{source} &8(&e/economy migrate {id}&8)"
# One source already imported.
line_done = "&8 - &f{source} &8(&e/economy migrate {id}&8) &7imported {when}"
# Nothing found.
none = "{prefix}&7No other economy data found."
# Unknown source.
unknown = "{prefix}&c{source} is not a source found on this server. Type &e/economy migrate &cto list them."
# Reading failed.
read_failed = "{prefix}&cCould not read the {source} data. Nothing was changed. See the server log."
# The target currency has no rate.
no_rate = "{prefix}&cNo rate for {currency}. Add it to rates in economy.toml."
# Preview title.
preview_header = "{prefix}&6Import from &f{source} &6into &f{currency}"
# Preview counts.
preview_counts = "&7 Players: &f{players} &8| &7Named accounts: &f{accounts} &8| &7Total: &e{total}"
# Preview: a rate from economy.toml.
preview_rate = "&7 Rate: &f{key} = {rate}"
# Preview: no rate set, 1:1 used.
preview_rate_default = "&7 Rate: &f{key} = {rate} &8(no line in rates, so 1:1)"
# Preview: entries that couldn't be read.
preview_skipped = "&7 Skipped (unreadable): &f{count}"
# Preview: imported before.
preview_already = "&e Already imported on {when}. Use &f/economy migrate {id} confirm again &eto add it a second time."
# How to go ahead.
preview_confirm = "&7Type &e/economy migrate {id} confirm &7within 2 minutes. Amounts are added to current balances."
# No preview to confirm.
nothing_pending = "{prefix}&cRun &e/economy migrate {id} &cfirst."
# Imported before, no "again".
already = "{prefix}&c{source} was already imported. Use &e/economy migrate {id} confirm again &cto add it a second time."
# Finished.
done = "{prefix}&aImported {count} balances from {source} ({total}). The original data was not changed."
# Some couldn't be added.
failed = "{prefix}&e{count} balances could not be added. See the transaction log."
