# ============================================================
#  ELEMENTS: ECONOMY  —  messages
#  Every line a player or admin sees. Colors: &a &l &#FFD700.
#  {prefix} is replaced with general.prefix.
#  Leave a message empty ("") to send nothing.
#  Missing lines use the built-in text, so updates never break this file.
# ============================================================

[general]
# Put in front of most messages.
prefix = "&6[Economy]&r "
# The player doesn't have permission.
no_permission = "{prefix}&cYou don't have permission to do that."
# The feature is switched off in features.toml.
disabled = "{prefix}&cThat feature is turned off on this server."
# No player with that name.
player_not_found = "{prefix}&cNo player called &f{player}&c."
# The player must be online for this.
player_offline = "{prefix}&c{player} must be online for this."
# The amount typed is not a number or is zero or less.
bad_amount = "{prefix}&c'{input}' is not a valid amount."
# Only a player can run this, not the console.
players_only = "{prefix}&cOnly players can do that."
# Something went wrong while saving or reading.
error = "{prefix}&cSomething went wrong. Tell an admin."
# Shown while the active currency can't be reached.
currency_unavailable = "{prefix}&cMoney is not available right now. Try again soon."

[balance]
# /bal for yourself. {balance} uses the active currency.
self = "{prefix}&7Balance: &e{balance}"
# /bal <player>.
other = "{prefix}&7{player}'s balance: &e{balance}"
# The active currency mod has no balance for this player yet.
none = "{prefix}&7No balance yet."

[pay]
# Sent to the payer.
sent = "{prefix}&7You paid &f{player} &e{amount}&7."
# Sent to the person paid.
received = "{prefix}&f{player} &7paid you &e{amount}&7."
# The payer doesn't have enough.
not_enough = "{prefix}&cYou don't have enough. You have &e{balance}&c."
# Paying yourself.
self = "{prefix}&cYou can't pay yourself."
# The other player turned off payments.
blocked = "{prefix}&c{player} is not accepting payments."
# The currency can't change offline balances.
offline_not_supported = "{prefix}&c{player} must be online to receive this currency."
# /pay toggle turned payments off.
toggle_off = "{prefix}&7You are no longer accepting payments."
# /pay toggle turned payments on.
toggle_on = "{prefix}&7You are accepting payments again."

[baltop]
# Title line. {page} and {pages} are page numbers.
header = "&6&lRichest players &7(page {page}/{pages})"
# One row. {rank} is the position.
line = "&7{rank}. &f{player} &8- &e{balance}"
# Nothing to show.
empty = "{prefix}&7No balances yet."
# The currency can't list everyone's balance.
not_supported = "{prefix}&cThis currency can't show a top list."

[history]
# Title line.
header = "&6&lPayment history &7- {player} (page {page}/{pages})"
# Money in.
line_in = "&8{time} &a+{amount} &7from &f{other} &8{note}"
# Money out.
line_out = "&8{time} &c-{amount} &7to &f{other} &8{note}"
# Nothing to show.
empty = "{prefix}&7No payments yet."

[eco]
# /eco give.
give = "{prefix}&7Gave &f{player} &e{amount}&7. New balance: &e{balance}"
# /eco take.
take = "{prefix}&7Took &e{amount} &7from &f{player}&7. New balance: &e{balance}"
# /eco set.
set = "{prefix}&7Set &f{player}&7's balance to &e{balance}&7."
# /eco reset.
reset = "{prefix}&7Reset &f{player}&7's balance to &e{balance}&7."
# The active currency doesn't allow this change.
not_supported = "{prefix}&cThe active currency doesn't allow that change."

[exchange]
# Coins turned into digital money.
deposited = "{prefix}&7Deposited &e{coins} &7for &e{amount}&7."
# Digital money turned into coins.
withdrew = "{prefix}&7Withdrew &e{amount} &7as &e{coins}&7."
# No coins to deposit.
no_coins = "{prefix}&cYou have no coins to deposit."
# Not enough room for the coins.
no_room = "{prefix}&cNot enough inventory space. Coins that didn't fit were dropped at your feet."
# Left over that can't be made with the coins available.
remainder = "{prefix}&7{amount} could not be paid out in coins and stays in your balance."

[currency]
# Logged and shown to admins when currency mods are found.
detected = "{prefix}&7Currency found: &f{currency} &8({mod})"
# No currency mod found, digital money is used.
digital = "{prefix}&7No currency mod found. Using digital money."
# Admin warning when a vanilla item is listed as currency.
vanilla_ask = "{prefix}&e{item} &7is listed as currency in currency_values.toml. Vanilla items are not money by default. Are you sure?"
# Label of the confirm button.
confirm_button = "&a&l[Confirm]"
# Hover text of the confirm button.
confirm_hover = "Count {item} as currency."
# Label of the ignore button.
ignore_button = "&c&l[Ignore]"
# Hover text of the ignore button.
ignore_hover = "Keep {item} as a normal item."
# The vanilla item now counts as currency.
confirmed = "{prefix}&a{item} now counts as currency."
# The vanilla item will not count as currency.
ignored = "{prefix}&7{item} will not count as currency."
# /economy currency pending, nothing waiting.
pending_none = "{prefix}&7No vanilla items are waiting for confirmation."
# /economy currency pending, title.
pending_header = "{prefix}&7{count} vanilla item(s) waiting:"
# /economy currency pending, one row.
pending_line = "&8 - &f{item}"
# Confirm or ignore on an item that isn't waiting.
not_pending = "{prefix}&c{item} is not waiting for confirmation."

[switch]
# Preview title.
preview_header = "{prefix}&6Switch from &f{from} &6to &f{to}"
# Preview: exchange rate example.
preview_rate = "&7 Rate: &f{example}"
# Preview: balances.
preview_balances = "&7 Balances: &f{now} &7now, &f{later} &7at next login"
# Preview: shops.
preview_shops = "&7 Shop prices: &f{prices} &8| &7Server shop prices: &f{server} &8| &7Shop tills: &f{tills}"
# Preview: auction house.
preview_listings = "&7 Auction listings: &f{listings} &8| &7Collection boxes: &f{boxes}"
# Preview: coin-priced shops left alone (item prices never become digital).
preview_skipped = "&7 Left alone (item prices never become digital): &f{skipped}"
# Preview: another mod's shops.
preview_bridge = "&7 {bridge}: &f{changed} &7changed, &f{skipped} &7left alone"
# How to go ahead.
preview_confirm = "&7Type &e/economy currency switch confirm &7within 2 minutes to go ahead."
# Backup taken before the switch.
backup = "{prefix}&7Backup saved: &f{folder}"
# The backup failed, nothing changed.
backup_failed = "{prefix}&cBackup failed. Nothing was changed."
# The switch finished.
done = "{prefix}&aCurrency switched to &f{to}&a. &f{changed} &athings updated, &f{later} &abalances convert at next login."
# No preview to confirm, or it ran out.
nothing_pending = "{prefix}&cRun &e/economy currency switch <currency> &cfirst."
# The new currency isn't installed or detected.
unknown = "{prefix}&c{currency} is not an installed currency."
# Already the server currency.
same = "{prefix}&c{currency} is already the server currency."
# No rate between the two currencies.
no_rate = "{prefix}&cNo exchange rate between {from} and {to}. Add both to rates in economy.toml."
# Another mod stopped the switch.
cancelled = "{prefix}&cAnother mod stopped the switch. Nothing was changed."
# Told to a player when their balance converts.
converted = "{prefix}&7The server currency changed. Your &f{from} &7became &e{to}&7."

