plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.165'
}

version = mod_version
group = 'com.tac5studios.elementseconomy'

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()      // Elements: Vault, published from the elements-vault folder
    mavenCentral()
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Elements: Vault, bundled inside the jar so Economy runs on its own.
    // If a stand-alone Vault jar is also installed, NeoForge loads the newer one only.
    implementation "com.tac5studios:elements_vault:${vault_version}"
    jarJar("com.tac5studios:elements_vault:${vault_version_range}") { version { prefer vault_version } }

    // YAML storage library, bundled inside the mod jar (jar-in-jar).
    // SQLite and MySQL drivers are not bundled: servers that use those backends
    // put the driver jar in elements_economy/drivers (see storage.toml).
    implementation "org.yaml:snakeyaml:${snakeyaml_version}"
    jarJar("org.yaml:snakeyaml:[2.2,3.0)") { version { prefer snakeyaml_version } }
}

// Compile-only stubs of other mods' APIs (Impactor, Kyori Adventure/Event, OctoEconomy) live in src/main/java
// so the bridges compile without those mods. They are never shipped: the real classes come from the mods.
tasks.withType(Jar).configureEach {
    exclude 'net/impactdev/**', 'net/kyori/**', 'com/epherical/**'
}

// The full jar (with Vault and the YAML library) is the main output: elements_economy-<version>.jar
tasks.named('jar') { archiveClassifier = 'slim' }
tasks.named('jarJar') { archiveClassifier = '' }

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description,
            vault_version_range: vault_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}
